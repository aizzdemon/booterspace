    <script type="module">

                question: "डॉ. एस.आर. रंगनाथन द्वारा प्रतिपादित पुस्तकालय विज्ञान का प्रथम नियम (First Law) इनमें से कौन सा है?",

            },
            {
                id: "sample_2",
                section: "Part 1",
                question: "कोलन क्लासिफिकेशन (Colon Classification - CC) का विकास किसके द्वारा किया गया था?",
                options: {
                    A: "मेल्विल डेवी (Melvil Dewey)",
                    B: "डॉ. एस.आर. रंगनाथन (Dr. S.R. Ranganathan)",
                    C: "सी.ए. कटर (C.A. Cutter)",
                    D: "डब्ल्यू.सी. बर्बिक सेयर्स"
                },
                correct: "B",
                solution: "Colon Classification (CC) was created by Dr. S.R. Ranganathan in 1933."
            },
            {
                id: "sample_3",
                section: "Part 2",
                question: "बिहार राज्य का राजकीय वृक्ष (State Tree of Bihar) कौन सा है?",
                options: {
                    A: "आम (Mango)",
                    B: "पीपल (Peepal)",
                    C: "बरगद (Banyan)",
                    D: "साल (Sal)"
                },
                correct: "B",
                solution: "बिहार का राजकीय वृक्ष 'पीपल' (Peepal) है।"
            }
        ];

        window.dbQuestions = [];
        window.db = null;
        window.currentFilter = 'all';

        // Tab switching handler
        window.switchFeederTab = function(tab) {
            const bulkForm = document.getElementById('bulk-question-form');
            const singleForm = document.getElementById('add-question-form');
            const bulkBtn = document.getElementById('tab-btn-bulk');
            const singleBtn = document.getElementById('tab-btn-single');

            if (tab === 'bulk') {

                singleBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 hover:text-slate-900 transition flex items-center justify-center gap-2";
            } else {
                bulkForm.classList.add('hidden');
                singleForm.classList.remove('hidden');
                singleBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-900 shadow transition flex items-center justify-center gap-2";
                bulkBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 hover:text-slate-900 transition flex items-center justify-center gap-2";
            }
        };

        // Example loader for bulk text
        window.loadSampleBulkText = function() {
            const sampleText = `1. डॉ. एस.आर. रंगनाथन द्वारा प्रतिपादित पुस्तकालय विज्ञान का प्रथम नियम (First Law) इनमें से कौन सा है?
A. प्रत्येक पाठक को उसकी पुस्तक मिले
B. पुस्तकें उपयोग के लिए हैं
C. प्रत्येक पुस्तक को उसका पाठक मिले
D. पाठक का समय बचाएं
Answer: B. पुस्तकें उपयोग के लिए हैं

2. भारत में पुस्तकालय आंदोलन (Library Movement) का जनक किसे माना जाता है?
A. डॉ. एस.आर. रंगनाथन
B. महाराजा सयाजीराव गायकवाड़ III
C. डब्ल्यू.ए. बोर्डन
D. बी.एस. केसवन
Answer: B

3. बिहार राज्य का राजकीय वृक्ष (State Tree) कौन सा है?
A. आम
B. पीपल
C. बरगद
D. साल
Answer: B. पीपल`;
            document.getElementById('bulk-input-text').value = sampleText;
            previewParsedQuestions();
        };

        // Text Parser Logic for Bulk Questions
        window.parseBulkQuestionsText = function(rawText, targetSection) {
            if (!rawText.trim()) return [];

            // Split into potential question blocks using regex for numbering pattern e.g. "1.", "2)", "Q1."
            const blocks = rawText.split(/\n(?=\s*(?:\d+[\.\)]|Q\d+[\.\)]?)\s+)/gi);
            const parsedList = [];

            blocks.forEach(block => {
                const text = block.trim();
                if (!text) return;

                // Extract Question line
                const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                if (lines.length < 5) return; // Must have question + 4 options minimum

                let qText = "";
                let optA = "", optB = "", optC = "", optD = "";
                let correctOpt = "A";
                let solutionText = "";

                lines.forEach(line => {
                    if (/^(?:\d+[\.\)]|Q\d+[\.\)]?)\s+/i.test(line)) {
                        qText = line.replace(/^(?:\d+[\.\)]|Q\d+[\.\)]?)\s+/i, '').trim();
                    } else if (/^[A][\.\)]\s*/i.test(line)) {
                        optA = line.replace(/^[A][\.\)]\s*/i, '').trim();
                    } else if (/^[B][\.\)]\s*/i.test(line)) {
                        optB = line.replace(/^[B][\.\)]\s*/i, '').trim();
                    } else if (/^[C][\.\)]\s*/i.test(line)) {
                        optC = line.replace(/^[C][\.\)]\s*/i, '').trim();
                    } else if (/^[D][\.\)]\s*/i.test(line)) {
                        optD = line.replace(/^[D][\.\)]\s*/i, '').trim();
                    } else if (/^(?:Answer|Ans|उत्तर|Correct Answer)\s*:\s*/i.test(line)) {
                        const ansStr = line.replace(/^(?:Answer|Ans|उत्तर|Correct Answer)\s*:\s*/i, '').trim();
                        const match = ansStr.match(/^([A-Da-d])/);
                        if (match) {
                            correctOpt = match[1].toUpperCase();
                        }
                        solutionText = ansStr;
                    }
                });

                if (qText && optA && optB && optC && optD) {
                    parsedList.push({
                        section: targetSection,
                        question: qText,
                        options: { A: optA, B: optB, C: optC, D: optD },
                        correct: correctOpt,
                        solution: solutionText || `Correct Option is ${correctOpt}`,
                        createdAt: new Date().toISOString()
                    });
                }
            });

            return parsedList;
        };

        // Preview & Count
        window.previewParsedQuestions = function() {
            const text = document.getElementById('bulk-input-text').value;
            const section = document.getElementById('bulk-input-section').value;
            const parsed = parseBulkQuestionsText(text, section);
            document.getElementById('parsed-count').innerText = parsed.length;
            return parsed;
        };

        // Submit Bulk Import
        window.handleBulkSubmit = async function(e) {
            e.preventDefault();
            const text = document.getElementById('bulk-input-text').value;
            const section = document.getElementById('bulk-input-section').value;
            const parsed = parseBulkQuestionsText(text, section);

            if (parsed.length === 0) {
                showModal("Parsing Failed", "Could not detect valid questions. Please format each question as:<br><br><b>1. Question text<br>A. Option 1<br>B. Option 2<br>C. Option 3<br>D. Option 4<br>Answer: B</b>", [
                    { label: "Got It", class: "bg-indigo-600 text-white text-xs px-4 py-2 rounded-lg font-bold", onClick: closeModal }
                ]);
                return;
            }

            const btnSave = document.getElementById('btn-bulk-save');
            btnSave.disabled = true;
            btnSave.innerText = `Saving ${parsed.length} Questions...`;

            try {
                if (window.db) {
                    const qCol = collection(window.db, 'artifacts', appId, 'public', 'data', 'bihar_let_questions');
                    for (const q of parsed) {
                        await addDoc(qCol, q);
                    }
                } else {
                    parsed.forEach((q, idx) => {
                        window.dbQuestions.push({ id: 'bulk_loc_' + Date.now() + '_' + idx, ...q });
                    });
                    renderQuestionsList();
                }

                showModal("Bulk Upload Complete!", `Successfully imported <b>${parsed.length} questions</b> into ${section}!`, [
                    { label: "Great!", class: "bg-emerald-600 text-white text-xs px-4 py-2 rounded-lg font-bold", onClick: closeModal }
                ]);

                document.getElementById('bulk-input-text').value = '';
                document.getElementById('parsed-count').innerText = '0';
            } catch (err) {
                console.error("Bulk upload error:", err);
                parsed.forEach((q, idx) => {
                    window.dbQuestions.push({ id: 'bulk_loc_' + Date.now() + '_' + idx, ...q });
                });
                renderQuestionsList();
                showModal("Saved Locally", `Imported ${parsed.length} questions locally into state.`, [
                    { label: "OK", class: "bg-indigo-600 text-white text-xs px-4 py-2 rounded-lg font-bold", onClick: closeModal }
                ]);
            } finally {
                btnSave.disabled = false;
                btnSave.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Save All Questions to DB`;
            }
        };

        // Listen for live input in text area
        document.addEventListener("DOMContentLoaded", () => {
            const bulkTextEl = document.getElementById('bulk-input-text');
            if (bulkTextEl) {
                bulkTextEl.addEventListener('input', previewParsedQuestions);
            }
        });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-slate-400 text-xs bg-white rounded-xl border">No questions found for this section. Add one from the form!</div>`;
                return;
            }

            filtered.forEach((q, idx) => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-2 relative group hover:border-indigo-300 transition";
                
                card.innerHTML = `
                    <div class="flex items-center justify-between text-xs">
                        <span class="bg-indigo-100 text-indigo-900 font-bold px-2 py-0.5 rounded">${q.section}</span>
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">Ans: ${q.correct}</span>
                            <button onclick="confirmDeleteQuestion('${q.id}')" class="text-rose-500 hover:text-rose-700 p-1 text-sm font-bold" title="Delete Question">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                    <p class="text-sm font-semibold text-slate-800">${idx + 1}. ${q.question}</p>
                    <div class="grid grid-cols-2 gap-1 text-[11px] text-slate-600 bg-slate-50 p-2 rounded">
                        <div>A: ${q.options.A}</div>
                        <div>B: ${q.options.B}</div>
                        <div>C: ${q.options.C}</div>
                        <div>D: ${q.options.D}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        };

        // Filter Function
        window.filterQuestionList = function(filter) {
            window.currentFilter = filter;
            ['all', 'p1', 'p2'].forEach(id => {
                const btn = document.getElementById(`filter-btn-${id}`);
                if (btn) {
                    btn.className = "flex-1 py-1.5 rounded-lg text-slate-600 text-center hover:text-slate-900";
                }
            });
            
            const activeId = filter === 'all' ? 'all' : filter === 'Part 1' ? 'p1' : 'p2';
            document.getElementById(`filter-btn-${activeId}`).className = "flex-1 py-1.5 rounded-lg bg-white text-indigo-900 font-bold shadow text-center";

            renderQuestionsList();
        };

        // Form Submit Handler
        window.handleQuestionSubmit = async function(e) {
            e.preventDefault();
            const statusEl = document.getElementById('admin-status');
            const saveBtn = document.getElementById('btn-save');
            
            statusEl.innerText = "Saving to Database...";
            saveBtn.disabled = true;

            const newQ = {
                section: document.getElementById('input-section').value,
                question: document.getElementById('input-question').value.trim(),
                options: {
                    A: document.getElementById('input-opt-a').value.trim(),
                    B: document.getElementById('input-opt-b').value.trim(),
                    C: document.getElementById('input-opt-c').value.trim(),
                    D: document.getElementById('input-opt-d').value.trim(),
                },
                correct: document.getElementById('input-correct').value,
                solution: document.getElementById('input-solution').value.trim(),
                createdAt: new Date().toISOString()
            };

            try {
                if (window.db) {
                    const qCol = collection(window.db, 'artifacts', appId, 'public', 'data', 'bihar_let_questions');
                    await addDoc(qCol, newQ);
                    showModal("Success!", "Question saved successfully into Firebase database.", [
                        { label: "OK", class: "bg-indigo-600 text-white text-xs px-4 py-2 rounded-lg font-bold", onClick: closeModal }
                    ]);
                } else {
                    window.dbQuestions.push({ id: 'loc_' + Date.now(), ...newQ });
                    renderQuestionsList();
                }

                statusEl.innerText = "Question added successfully!";
                document.getElementById('add-question-form').reset();
            } catch (err) {
                console.error(err);
                window.dbQuestions.push({ id: 'loc_' + Date.now(), ...newQ });
                renderQuestionsList();
                statusEl.innerText = "Saved to local state!";
            } finally {
                saveBtn.disabled = false;
            }
        };

        // Delete Question
        window.confirmDeleteQuestion = function(id) {
            showModal(
                "Delete Question?",
                "Are you sure you want to remove this question from the database?",
                [
                    { label: "Cancel", class: "bg-slate-200 text-slate-800 text-xs px-4 py-2 rounded-lg font-bold", onClick: closeModal },
                    { label: "Delete", class: "bg-rose-600 text-white text-xs px-4 py-2 rounded-lg font-bold shadow", onClick: () => executeDelete(id) }
                ]
            );
        };

        async function executeDelete(id) {
            closeModal();
            try {
                if (window.db && !id.startsWith('sample_') && !id.startsWith('loc_')) {
                    const docRef = doc(window.db, 'artifacts', appId, 'public', 'data', 'bihar_let_questions', id);
                    await deleteDoc(docRef);
                } else {
                    window.dbQuestions = window.dbQuestions.filter(q => q.id !== id);
                    renderQuestionsList();
                }
            } catch (e) {
                window.dbQuestions = window.dbQuestions.filter(q => q.id !== id);
                renderQuestionsList();
            }
        }

        window.resetToSampleQuestions = function() {
            window.dbQuestions = [...defaultSampleQuestions];
            renderQuestionsList();
        };

        // Modal Helpers
        function showModal(title, bodyHtml, actions) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            const actionsDiv = document.getElementById('modal-actions');
            actionsDiv.innerHTML = '';

            actions.forEach(act => {
                const b = document.createElement('button');
                b.className = act.class;
                b.innerHTML = act.label;
                b.onclick = act.onClick;
                actionsDiv.appendChild(b);
            });

            document.getElementById('modal-container').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-container').classList.add('hidden');
        }

        window.onload = function() {
            initAdmin();
        };
    </script>
</body>
</html>
