<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Available Tests | BooterSpace</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body class="min-h-screen bg-slate-100 text-slate-800"><header class="bg-slate-950 text-white p-5"><div class="max-w-5xl mx-auto font-black">BooterSpace <span class="text-blue-300">| Bihar LET CBT</span></div></header><main class="max-w-5xl mx-auto p-4 sm:p-8"><section class="rounded-3xl bg-gradient-to-r from-indigo-950 to-blue-800 text-white p-8 mb-8"><h1 class="text-3xl font-black">Choose your test</h1><p class="text-sm text-blue-100 mt-3">Select a test to open the CBT portal with its own questions.</p></section><div class="flex justify-between items-center mb-4"><h2 class="text-xl font-extrabold">Available Tests</h2><button id="refresh" class="rounded-xl border bg-white px-4 py-2 text-sm font-bold">Refresh</button></div><p id="status" class="rounded-xl bg-white border p-5 text-sm text-slate-500">Loading tests from Firebase…</p><div id="list" class="hidden grid md:grid-cols-2 gap-4"></div></main><script type="module">const APP_ID="bihar-let-2026-app";const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function load(){ $("status").classList.remove("hidden");$("status").textContent="Loading tests from Firebase…";$("list").classList.add("hidden");try{let m=null;for(const p of ["./public/js/firebase-singleton.js","/booterspace/public/js/firebase-singleton.js","../public/js/firebase-singleton.js"]){try{const x=await import(new URL(p,document.baseURI).href);if(x.getFirebaseServices&&x.loadFirebaseModule){m=x;break}}catch(e){}}if(!m)throw Error("Firebase singleton not found.");const s=await m.getFirebaseServices();const fs=await m.loadFirebaseModule("firebase-firestore.js");const snap=await fs.getDocs(fs.collection(s.db,"artifacts",APP_ID,"public","data","tests"));const ts=snap.docs.map(d=>({id:d.id,...d.data()})).filter(t=>t.status!=="draft").sort((a,b)=>String(a.testNo||"").localeCompare(String(b.testNo||""),undefined,{numeric:true}));if(!ts.length){$("status").textContent="No tests published yet.";return}$("list").innerHTML=ts.map(t=>'<article class="rounded-2xl bg-white border p-5 shadow-sm"><div class="text-xs font-bold text-indigo-700">TEST NO. '+esc(t.testNo||"—")+'</div><h3 class="text-xl font-extrabold mt-2">'+esc(t.testName||"Untitled Test")+'</h3><p class="text-sm text-slate-500 mt-2">'+Number(t.questionCount||0)+' questions</p><a class="inline-flex mt-5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white px-4 py-3 text-sm font-bold" href="./cbtlet.html?testId='+encodeURIComponent(t.id)+'">Start Test →</a></article>').join("");$("status").classList.add("hidden");$("list").classList.remove("hidden")}catch(e){console.error(e);$("status").textContent="Could not load tests: "+(e.message||e)}}$("refresh").addEventListener("click",load);load();</script></body></html>
