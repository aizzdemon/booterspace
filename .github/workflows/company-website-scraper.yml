name: Company Website Job Scraper

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: company-website-job-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Firebase Admin SDK
        run: python -m pip install --upgrade pip firebase-admin
      - name: Check Python syntax
        run: python -m py_compile scripts/scrape_company_jobs.py
      - name: Process queued company website scans
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: kar-kardan
        run: python scripts/scrape_company_jobs.py