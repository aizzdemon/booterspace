name: Daily Job Data Update

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Prevent scheduled and manual runs from racing to update jobs.json.
concurrency:
  group: daily-job-data-update
  cancel-in-progress: false

jobs:
  refresh-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Firebase Admin SDK
        run: python -m pip install --upgrade pip firebase-admin
      - name: Check Python syntax
        run: python -m py_compile scripts/update_jobs.py

      - name: Collect jobs and queue them for admin review
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: kar-kardan
        run: python scripts/update_jobs.py
      - name: Commit updated jobs export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git diff --staged --quiet || git commit -m "chore: refresh automated jobs export"
          # Rebase on any commits that landed while collection was running.
          git pull --rebase origin main
          git push
