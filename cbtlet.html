<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bihar LET 2026 Portal - BCECE LE Entrance Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>

// Database configuration for Bihar LET 2026
const DB_NAME = 'BiharLET2026_Database';
const DB_VERSION = 1;
const STORE_NAME = 'question_bank';

// Open IndexedDB Connection
function getDatabase() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
            }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject('Database connection failed: ' + e.target.error);
    });
}

/**
 * Reads questions strictly from the local database.
 * No fallback or preloaded static data is used.
 */
async function fetchQuestionsFromDatabase(selectedCategory = 'all') {
    try {
        const db = await getDatabase();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const request = store.getAll();

            request.onsuccess = () => {
                let questions = request.result || [];
                if (selectedCategory !== 'all') {
                    questions = questions.filter(q => q.subject === selectedCategory || q.category === selectedCategory);
                }
                resolve(questions);
            };
            request.onerror = () => reject(request.error);
        });
    } catch (err) {
        console.error('Error reading database:', err);
        return [];
    }
}


    <!-- Top Bar Header -->
async function loadExamQuestions() {
    // Removed all preloaded mock data array fallbacks
    showLoadingSpinner();

    const questions = await fetchQuestionsFromDatabase(currentSubjectFilter);

    if (!questions || questions.length === 0) {
        renderEmptyDatabaseState();
        return;
    }

    renderQuestions(questions);
}

function renderEmptyDatabaseState() {
    const mainContainer = document.getElementById('question-display-area');
    if (!mainContainer) return;

    mainContainer.innerHTML = `
        <div class="flex flex-col items-center justify-center p-10 text-center bg-white dark:bg-slate-800 rounded-xl border border-dashed border-slate-300 dark:border-slate-700 shadow-sm my-6">
            <div class="w-16 h-16 bg-blue-50 dark:bg-slate-700 text-blue-600 dark:text-blue-400 rounded-full flex items-center justify-center mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s8-1.79-8-4"></path>
                </svg>
            </div>
            <h3 class="text-xl font-bold text-slate-800 dark:text-slate-100 mb-2">Database Empty</h3>
            <p class="text-slate-500 dark:text-slate-400 max-w-md text-sm mb-6">
                No questions were found in the database. Preloaded questions have been disabled; this portal reads data exclusively from your registered question database.
            </p>
            <div class="flex gap-3">
                <button onclick="triggerDatabaseImport()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg transition shadow-sm">
                    Import Question Database (JSON / CSV)
                </button>
            </div>
        </div>
    `;
}

        // --- STATE VARIABLES ---
        let currentIndex = 0;
        let activeSubject = 'ALL';
        let userAnswers = new Array(150).fill(null); // stores index of selected option
        let questionStatus = new Array(150).fill('not-visited'); // 'not-visited', 'not-answered', 'answered', 'marked'
        let timerSeconds = 7200; // 2 hours
        let timerInterval = null;

        // --- INITIALIZATION ---
        window.onload = function() {
            renderQuestion(currentIndex);
            renderPalette();
            startTimer();
            updateCounts();
        };

        // --- NAVIGATION TABS ---
        function switchTab(tabId) {
            const tabs = ['mock-test', 'syllabus', 'pyq', 'rank-calc'];
            tabs.forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                const navBtn = document.getElementById(`tab-${t}`);
                if (navBtn) {
                    navBtn.className = "px-4 py-2 rounded-lg text-sm font-semibold transition text-slate-200 hover:bg-white/10";
                }
            });

            document.getElementById(`view-${tabId}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-${tabId}`);
            if (activeBtn) {
                activeBtn.className = "px-4 py-2 rounded-lg text-sm font-semibold transition bg-white/10 text-white hover:bg-white/20";
            }

            // Close mobile menu if open
            document.getElementById('mobile-menu').classList.add('hidden');
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        // --- QUESTION FILTERING BY SUBJECT ---
        function filterSubject(sub) {
            activeSubject = sub;
            const buttons = document.querySelectorAll('.sub-tab-btn');
            buttons.forEach(btn => {
                btn.className = "sub-tab-btn px-4 py-2 rounded-xl text-xs font-bold border border-slate-200 bg-white text-slate-700 hover:bg-slate-100 transition whitespace-nowrap";
            });

            const active = document.getElementById(`sub-${sub}`);
            if (active) {
                active.className = "sub-tab-btn active px-4 py-2 rounded-xl text-xs font-bold border border-bihar-600 bg-bihar-600 text-white transition shadow-sm whitespace-nowrap";
            }

            // Find first question matching subject
            if (sub !== 'ALL') {
                const targetIdx = fullQuestionBank.findIndex(q => q.subject === sub);
                if (targetIdx !== -1) {
                    currentIndex = targetIdx;
                    renderQuestion(currentIndex);
                }
            }
        }

        // --- STREAMING_CHUNK:Render Question without any Shuffled indicators ---
        function renderQuestion(index) {
            const q = fullQuestionBank[index];
            if (!q) return;

            // Update status if first visit
            if (questionStatus[index] === 'not-visited') {
                questionStatus[index] = 'not-answered';
            }

            // Update UI Badges & Text
            document.getElementById('q-number-badge').innerText = `Question ${index + 1} of 150`;
            document.getElementById('q-subject-badge').innerText = q.subjectName;
            document.getElementById('q-text').innerText = q.question;

            // Render Options (Clean A, B, C, D without any Shuffled option text)
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const optionPrefixes = ['A', 'B', 'C', 'D'];

            q.options.forEach((optText, optIdx) => {
                const isSelected = userAnswers[index] === optIdx;
                
                const optCard = document.createElement('div');
                optCard.className = `option-card border rounded-2xl p-4 cursor-pointer transition flex items-start space-x-3 ${isSelected ? 'selected' : 'border-slate-200 bg-white'}`;
                optCard.onclick = () => selectOption(optIdx);

                optCard.innerHTML = `
                    <div class="w-7 h-7 rounded-full font-bold text-xs flex items-center justify-center shrink-0 transition ${isSelected ? 'bg-bihar-600 text-white' : 'bg-slate-100 text-slate-600 border border-slate-300'}">
                        ${optionPrefixes[optIdx]}
                    </div>
                    <div class="text-sm font-medium text-slate-800 pt-0.5 flex-1">
                        ${optText}
                    </div>
                `;
                optionsContainer.appendChild(optCard);
            });

            // Button Disable State
            document.getElementById('btn-prev').disabled = (index === 0);
            document.getElementById('btn-prev').style.opacity = (index === 0) ? '0.5' : '1';

            renderPalette();
            updateCounts();
        }

        // --- OPTION SELECTION LOGIC ---
        function selectOption(optIdx) {
            userAnswers[currentIndex] = optIdx;
            questionStatus[currentIndex] = 'answered';
            renderQuestion(currentIndex);
        }

        function clearResponse() {
            userAnswers[currentIndex] = null;
            questionStatus[currentIndex] = 'not-answered';
            renderQuestion(currentIndex);
            showToast("Selected response cleared");
        }

        function markForReview() {
            questionStatus[currentIndex] = 'marked';
            renderQuestion(currentIndex);
            showToast("Marked for review");
        }

        function nextQuestion() {
            if (currentIndex < fullQuestionBank.length - 1) {
                currentIndex++;
                renderQuestion(currentIndex);
            } else {
                showToast("You are at the last question.");
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion(currentIndex);
            }
        }

        function jumpToQuestion(index) {
            currentIndex = index;
            renderQuestion(currentIndex);
        }

        // --- STREAMING_CHUNK:Rendering Question Palette Grid ---
        function renderPalette() {
            const grid = document.getElementById('palette-grid');
            grid.innerHTML = '';

            fullQuestionBank.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.innerText = idx + 1;
                
                let statusClass = "bg-slate-100 text-slate-600 border border-slate-300 hover:bg-slate-200"; // not visited
                
                if (idx === currentIndex) {
                    statusClass += " ring-2 ring-bihar-600 ring-offset-1 font-bold";
                }

                if (questionStatus[idx] === 'answered') {
                    statusClass = "bg-emerald-500 text-white font-bold";
                } else if (questionStatus[idx] === 'not-answered') {
                    statusClass = "bg-rose-500 text-white font-bold";
                } else if (questionStatus[idx] === 'marked') {
                    statusClass = "bg-amber-400 text-slate-900 font-bold";
                }

                btn.className = `h-9 rounded-lg text-xs flex items-center justify-center transition shadow-xs ${statusClass}`;
                btn.onclick = () => jumpToQuestion(idx);
                grid.appendChild(btn);
            });
        }

        function updateCounts() {
            let answered = 0;
            let notAnswered = 0;
            let marked = 0;
            let notVisited = 0;

            questionStatus.forEach(st => {
                if (st === 'answered') answered++;
                else if (st === 'not-answered') notAnswered++;
                else if (st === 'marked') marked++;
                else notVisited++;
            });

            document.getElementById('count-answered').innerText = answered;
            document.getElementById('count-not-answered').innerText = notAnswered;
            document.getElementById('count-marked').innerText = marked;
            document.getElementById('count-not-visited').innerText = notVisited;
        }

        // --- TIMER ENGINE ---
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    confirmSubmitTest();
                    return;
                }
                timerSeconds--;
                const hrs = Math.floor(timerSeconds / 3600);
                const mins = Math.floor((timerSeconds % 3600) / 60);
                const secs = timerSeconds % 60;
                document.getElementById('exam-timer').innerText = 
                    `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            }, 1000);
        }

        // --- SUBMIT TEST & SCORE CALCULATION ---
        function confirmSubmitTest() {
            let totalMarks = 0;
            let attempted = 0;
            let correctCount = 0;
            let englishMarks = 0;

            fullQuestionBank.forEach((q, idx) => {
                const userAns = userAnswers[idx];
                if (userAns !== null) {
                    attempted++;
                    if (userAns === q.correct) {
                        correctCount++;
                        totalMarks += 4;
                        if (q.subject === 'ENG') englishMarks += 4;
                    } else {
                        totalMarks -= 1;
                        if (q.subject === 'ENG') englishMarks -= 1;
                    }
                }
            });

            const accuracy = attempted > 0 ? Math.round((correctCount / attempted) * 100) : 0;

            document.getElementById('score-total').innerText = `${totalMarks} / 600`;
            document.getElementById('score-accuracy').innerText = `${accuracy}%`;
            document.getElementById('score-attempted').innerText = `${attempted} / 150`;
            document.getElementById('score-english').innerText = `${englishMarks} Marks`;

            document.getElementById('modal-result').classList.remove('hidden');
        }

        function closeResultModal() {
            document.getElementById('modal-result').classList.add('hidden');
        }

        function restartTest() {
            userAnswers = new Array(150).fill(null);
            questionStatus = new Array(150).fill('not-visited');
            currentIndex = 0;
            timerSeconds = 7200;
            closeResultModal();
            renderQuestion(currentIndex);
            startTimer();
            showToast("Test restarted successfully");
        }

        // --- RANK ESTIMATOR CALCULATOR ---
        function calculateRank() {
            const score = parseInt(document.getElementById('calc-score').value) || 0;
            const engScore = parseInt(document.getElementById('calc-eng').value) || 0;

            const resBox = document.getElementById('calc-result');
            const resRank = document.getElementById('res-rank');
            const resEng = document.getElementById('res-eng-status');

            resBox.classList.remove('hidden');

            if (engScore >= 35) {
                resEng.innerText = "QUALIFIED (Eligible for Merit Rank)";
                resEng.className = "font-bold text-emerald-600";
            } else {
                resEng.innerText = "NOT QUALIFIED (Requires min 35 Marks in Technical English)";
                resEng.className = "font-bold text-rose-600";
            }

            if (score >= 320) {
                resRank.innerText = "AIR 1 - 50 (Top Bihar Govt Engineering Colleges)";
            } else if (score >= 240) {
                resRank.innerText = "AIR 51 - 200 (MIT Muzaffarpur, BCE Bhagalpur)";
            } else if (score >= 160) {
                resRank.innerText = "AIR 201 - 600 (GEC Gaya, BCE Patna)";
            } else {
                resRank.innerText = "AIR 600+ (New State Engineering Colleges)";
            }
        }

        // --- TOAST NOTIFICATION HELPERS ---
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            toast.classList.remove('opacity-0', 'translate-y-20', 'pointer-events-none');
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-20', 'pointer-events-none');
            }, 3000);
        }
    </script>
</body>
</html>
